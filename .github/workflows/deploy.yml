name: Deploy to AWS

on:
  push:
    branches: [master, develop]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::129045776282:role/KingsHeraldGitHubDeploy
          aws-region: us-east-1

      - name: Install CDK app deps
        working-directory: infra
        run: npm ci

      # master -> production stack, develop -> beta stack. workflow_dispatch on a
      # branch follows that same rule; anything else deploys nothing.
      - name: Pick target stack
        id: target
        run: |
          if [ "${{ github.ref }}" = "refs/heads/master" ]; then
            echo "stack=KingsHeraldStack" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref }}" = "refs/heads/develop" ]; then
            echo "stack=KingsHeraldStack-Beta" >> "$GITHUB_OUTPUT"
          else
            echo "No deploy target for ${{ github.ref }}"; exit 1
          fi

      - name: cdk deploy
        working-directory: infra
        run: npx cdk deploy ${{ steps.target.outputs.stack }} --require-approval never
